name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-7.0.14
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
        env:
          MONGOMS_VERSION: 7.0.14
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deps:report
      - run: npm run audit:report
      - run: npm run bundle:budget
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: ops/reports
          if-no-files-found: ignore

  lighthouse:
    if: hashFiles('apps/ai-hub/package.json') != ''
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @fab5/ai-hub
      - run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: ops/reports/lighthouse
          if-no-files-found: ignore
